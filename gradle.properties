# Gradle Properties for GoldenV2

# JDK 17 for Gradle daemon (Gradle 8.7 supports JDK 8-21)
org.gradle.java.home=/Users/majidghafouri/Library/Java/JavaVirtualMachines/jbr-17.0.14/Contents/Home

# JVM Args for build performance
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2,TLSv1.3 -Dsun.net.inetaddr.ttl=0 -Dsun.net.inetaddr.negative.ttl=0

# Parallel execution
org.gradle.parallel=true

# Configuration cache
org.gradle.configuration-cache=false

# Kotlin daemon
kotlin.daemon.enabled=true

# AndroidX
android.enableJetifier=true
android.useAndroidX=true

# Namespace
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
android.aapt2FromMavenOverride=/tmp/aapt2-bin/aapt2

# Build cache
android.buildCache=true

# Jetpack Compose compiler
kotlin.compiler.execution.strategy=in-process

# Disable R8 for debug builds
android.enableR8.fullMode=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
